<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>时光日记</title>
    
    <link rel="icon" href="https://raw.githubusercontent.com/yinyindong/img/main/cat-icon.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/yinyindong/img/main/cat-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* CSS 变量与深色模式支持 */
        :root { 
            --ios-blue: #007AFF; 
            --ios-green: #34C759; 
            --ios-red: #FF3B30; 
            
            /* 浅色主题变量 */
            --bg-color: #F2F2F7; 
            --card-color: #FFFFFF; 
            --text-main: #000000; 
            --text-sub: #8E8E93; 
            --border-color: rgba(60,60,67,0.1); 
            --nav-bg: rgba(255,255,255,0.7); 
            --search-bg: #E3E3E8;
            --shadow-color: rgba(0,0,0,0.04);
        }

        /* 自动读取 iOS 系统深色模式 */
        @media (prefers-color-scheme: dark) {
            :root {
                --ios-blue: #0A84FF; 
                --ios-green: #30D158; 
                --ios-red: #FF453A; 
                
                /* 深色主题变量 */
                --bg-color: #000000; 
                --card-color: #1C1C1E; 
                --text-main: #FFFFFF; 
                --text-sub: #EBEBF5; 
                --border-color: rgba(84,84,88,0.65); 
                --nav-bg: rgba(28,28,30,0.7); 
                --search-bg: #2C2C2E;
                --shadow-color: rgba(0,0,0,0.2);
            }
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg-color); margin: 0; color: var(--text-main); -webkit-tap-highlight-color: transparent; overflow-x: hidden; transition: background-color 0.3s, color 0.3s; }
        
        /* 弹性滑动动画 */
        .view { display: none; padding-top: env(safe-area-inset-top); min-height: 100vh; width: 100%; box-sizing: border-box; }
        .view.active { display: block; animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .clickable { transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.15s; cursor: pointer; }
        .clickable:active { transform: scale(0.95); opacity: 0.6; }

        /* 终极毛玻璃导航栏 */
        .navbar { position: sticky; top: 0; background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); display: flex; justify-content: center; align-items: center; height: 50px; border-bottom: 0.5px solid var(--border-color); z-index: 100; }
        .nav-title { font-size: 17px; font-weight: 600; }

        /* 卡片统一样式 (Inset Grouped) */
        .card, .progress-card, .history-card, .diary-card, #list-body, #summary-menu { background: var(--card-color); border-radius: 16px; margin: 0 16px 16px; box-shadow: 0 4px 16px var(--shadow-color); border: 0.5px solid var(--border-color); }
        
        .progress-card { padding: 16px; margin-top: 16px; }
        .progress-bar-bg { background: var(--search-bg); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 10px; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--ios-blue), #5AC8FA); width: 0%; transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1); }

        .history-card { background: linear-gradient(135deg, #5b86e5, #36d1dc); color: white; padding: 16px; border: none; }

        .card { padding: 16px; }
        .cal-header { font-size: 18px; font-weight: bold; color: var(--ios-blue); display: flex; align-items: center; margin-bottom: 14px; }
        .cal-header::after { content: ' ▾'; font-size: 12px; margin-left: 4px; opacity: 0.6; }
        
        .weekday-header { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; font-size: 12px; color: var(--text-sub); margin-bottom: 10px; font-weight: 600; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
        .cal-day { font-size: 16px; height: 38px; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
        
        .cal-day.today::before { content: ''; position: absolute; width: 34px; height: 34px; background: var(--ios-blue); border-radius: 50%; z-index: -1; opacity: 0.15; }
        .cal-day.today { color: var(--ios-blue); font-weight: bold; }
        .cal-day.has-note::after { content: ''; position: absolute; bottom: 2px; width: 4px; height: 4px; background: var(--ios-blue); border-radius: 50%; }
        .cal-day.missed::before { content: ''; position: absolute; width: 30px; height: 30px; border: 1.5px dashed var(--ios-red); border-radius: 50%; opacity: 0.4; }

        /* 按钮与表单 */
        .action-bar { display: flex; margin: 0 16px 16px; gap: 12px; }
        .action-btn { flex: 1; background: var(--card-color); padding: 14px; border-radius: 14px; border: 0.5px solid var(--border-color); color: var(--ios-blue); font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 8px var(--shadow-color); }
        .btn-primary { background: var(--ios-blue); color: #FFF; border: none; }
        
        .search-bar { background: var(--search-bg); margin: 0 16px 16px; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; }
        .search-bar input { border: none; background: transparent; width: 100%; font-size: 16px; outline: none; margin-left: 8px; color: var(--text-main); }
        .search-bar input::placeholder { color: var(--text-sub); }
        
        /* 列表容器 */
        #list-body { padding: 0; }
        .list-item { padding: 16px; border-bottom: 0.5px solid var(--border-color); }
        .list-item:last-child { border-bottom: none; }
        
        /* 独立卡片编辑器 */
        .diary-card { margin-top: 16px; min-height: 75vh; display: flex; flex-direction: column; overflow: hidden; }
        .diary-meta { padding: 18px 20px; border-bottom: 0.5px solid var(--border-color); }
        #f-date { border: none; font-size: 20px; font-weight: bold; background: transparent; outline: none; -webkit-appearance: none; padding: 0; color: var(--ios-blue); width: 100%; }
        #f-loc { border: none; font-size: 15px; color: var(--text-sub); background: transparent; outline: none; width: 85%; margin-top: 8px; }
        #f-loc::placeholder { color: var(--text-sub); opacity: 0.6; }
        
        textarea { flex: 1; width: 100%; padding: 20px; border: none; font-size: 17px; line-height: 1.8; letter-spacing: 0.02em; outline: none; background: transparent; resize: none; box-sizing: border-box; color: var(--text-main); }
        textarea::placeholder { color: var(--text-sub); opacity: 0.5; }
        
        /* SVG 图标通用样式 */
        .svg-icon { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
</head>
<body>

    <div id="view-main" class="view active">
        <div class="navbar"><div class="nav-title">时光日记</div></div>
        
        <div class="progress-card">
            <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--text-sub); font-weight:500;">
                <span id="year-label">2026年进度</span><span id="p-percent">0%</span>
            </div>
            <div class="progress-bar-bg"><div id="p-fill" class="progress-bar-fill"></div></div>
        </div>
        
        <div class="history-card clickable" onclick="nextHistory()">
            <h5 style="margin:0; font-size:11px; opacity:0.8; font-weight:normal; display:flex; align-items:center; gap:4px;">
                <svg width="12" height="12" class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                历史上的今天
            </h5>
            <div id="history-text" style="margin-top:6px; line-height:1.5; font-weight:500; font-size:15px;">史册同步中...</div>
        </div>
        
        <div class="card">
            <div class="cal-header clickable" id="cal-display" onclick="toggleMonthPicker()">加载中...</div>
            <div class="weekday-header">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>
            <div id="cal-view-grid"><div class="cal-grid" id="cal-body"></div></div>
            <div id="cal-view-months" style="display:none"><div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px;" id="month-grid"></div></div>
        </div>
        
        <div class="action-bar">
            <button class="action-btn clickable" onclick="enterSummaryView()">
                <svg width="20" height="20" class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="8" y2="16"></line><line x1="16" y1="14" x2="16" y2="16"></line></svg>
                总结同步
            </button>
            <button class="action-btn clickable" onclick="openEditor()">
                <svg width="20" height="20" class="svg-icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                记录当下
            </button>
        </div>
        
        <div class="search-bar">
            <svg width="18" height="18" class="svg-icon" style="color:var(--text-sub);" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="q" placeholder="搜索记忆..." oninput="renderList()">
        </div>
        <div id="list-body"></div>
    </div>

    <div id="view-edit" class="view" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event)">
        <div class="navbar">
            <button class="clickable" style="position:absolute; left:16px; color:var(--ios-blue); border:none; background:none; font-size:17px; display:flex; align-items:center; gap:4px;" onclick="switchView('view-main')">
                <svg width="20" height="20" class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>返回
            </button>
            <div class="nav-title">日记编辑</div>
            <button class="clickable" style="position:absolute; right:16px; color:var(--ios-blue); border:none; background:none; font-size:17px; font-weight:600;" onclick="save()">完成</button>
        </div>
        
        <div class="diary-card">
            <div class="diary-meta">
                <input type="date" id="f-date" onchange="loadDateRecord(this.value)">
                <div style="display:flex; align-items:center; margin-top:8px;">
                    <svg width="16" height="16" class="svg-icon" style="color:var(--text-sub); margin-right:6px;" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    <input type="text" id="f-loc" placeholder="添加位置...">
                    <span class="clickable" onclick="getLoc()" style="font-size:13px; color:var(--ios-blue); margin-left:auto; font-weight:500;">获取定位</span>
                </div>
            </div>
            <textarea id="f-content" placeholder="记录这一刻...&#10;&#10;(在卡片上左右滑动可翻阅前/后一天的日记)"></textarea>
        </div>
    </div>

    <div id="view-summary" class="view">
        <div class="navbar">
            <button class="clickable" style="position:absolute; left:16px; color:var(--ios-blue); border:none; background:none; font-size:17px; display:flex; align-items:center; gap:4px;" onclick="switchView('view-main')">
                <svg width="20" height="20" class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>返回
            </button>
            <div class="nav-title">总结与数据</div>
        </div>
        <div id="summary-menu" style="padding:20px; margin-top:16px;">
            <button class="action-btn clickable" style="width:100%; margin-bottom:14px;" onclick="makeReport(7)">生成本周总结</button>
            <button class="action-btn clickable" style="width:100%; margin-bottom:14px;" onclick="makeReport(30)">生成月度总结</button>
            <button class="action-btn clickable" style="width:100%; margin-bottom:24px;" onclick="makeReport(365)">生成年度总结</button>
            <div style="display:flex; gap:12px;">
                <button class="action-btn clickable" style="flex:1; color:var(--text-main);" onclick="exportData()">备份数据</button>
                <button class="action-btn clickable" style="flex:1; color:var(--text-main);" onclick="document.getElementById('import-input').click()">恢复数据</button>
            </div>
            <input type="file" id="import-input" accept=".json" onchange="importData(event)" style="display:none;">
        </div>
        
        <div id="report-wrap" class="card" style="display:none; padding:20px; margin-top:16px;">
            <button class="action-btn btn-primary clickable" id="btn-copy-prompt" style="width:100%; margin-bottom:20px;">✨ 复制 AI 分析指令</button>
            <div id="report-out" style="line-height:1.6; font-size:15px; color:var(--text-main); max-height:50vh; overflow-y:auto; padding-right:5px;"></div>
            <button class="action-btn clickable" id="btn-pdf-export" style="width:100%; margin-top:20px; color:var(--text-sub); border:none;">导出长图 (PDF)</button>
            <button class="clickable" style="display:block; width:100%; margin-top:20px; text-align:center; color:var(--ios-blue); border:none; background:none; font-size:15px;" onclick="resetSummaryView()">返回重新选择</button>
        </div>
    </div>

    <script>
        const DB_KEY = 'cnote_v39_pro_visual';
        let db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        let curMonth = new Date(), historyEvents = [], historyIndex = 0, touchStartX = 0;
        let currentPrompt = "";

        const formatLocalDate = (d) => {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        window.onload = () => { 
            initAutoRefresh(); renderCal(); renderList(); updateYearProgress(); fetchWikiHistory(); 
        };

        function initAutoRefresh() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            setTimeout(() => { renderCal(); updateYearProgress(); initAutoRefresh(); }, (tomorrow - now) + 500);
        }

        async function fetchWikiHistory() {
            try {
                const now = new Date();
                const res = await fetch(`https://zh.wikipedia.org/api/rest_v1/feed/onthisday/events/${now.getMonth()+1}/${now.getDate()}`);
                const data = await res.json();
                historyEvents = data.events || []; showHistory();
            } catch (e) { document.getElementById('history-text').innerText = "人类历史长河静静流淌..."; }
        }
        function showHistory() { 
            if(historyEvents.length) {
                const ev = historyEvents[historyIndex];
                document.getElementById('history-text').innerText = `${ev.year}年：${ev.text}`;
            }
        }
        function nextHistory() { historyIndex = (historyIndex + 1) % historyEvents.length; showHistory(); }

        function getLoc() {
            const locInput = document.getElementById('f-loc');
            locInput.value = "定位中...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=zh-cn`);
                    const data = await res.json();
                    const addr = data.address;
                    locInput.value = (addr.city || addr.town || addr.province || "") + (addr.suburb || addr.district || "");
                } catch(e) { locInput.value = "解析失败，请重试"; }
            }, () => { locInput.value = "获取定位失败"; });
        }

        function enterSummaryView() { resetSummaryView(); switchView('view-summary'); }
        function resetSummaryView() {
            document.getElementById('summary-menu').style.display = 'block';
            document.getElementById('report-wrap').style.display = 'none';
            document.getElementById('report-out').innerHTML = '';
            currentPrompt = "";
        }
        function makeReport(days) {
            const cutoff = Date.now() - (days * 86400000);
            const items = db.filter(x => new Date(x.date).getTime() >= cutoff).sort((a,b) => a.date.localeCompare(b.date));
            if(!items.length) return alert("这段期间内没有写日记哦。");
            
            document.getElementById('summary-menu').style.display = 'none';
            document.getElementById('report-wrap').style.display = 'block';
            let rawStr = ""; let htmlOut = "";
            
            items.forEach(x => {
                rawStr += `${x.date}: ${x.con}\n\n`;
                htmlOut += `<div style="margin-bottom:16px; border-bottom:0.5px solid var(--border-color); padding-bottom:12px;">
                                <strong style="color:var(--ios-blue); font-size:16px;">${x.date}</strong>
                                <span style="font-size:12px; color:var(--text-sub); margin-left:8px;">${x.loc || ''}</span>
                                <div style="margin-top:8px; line-height:1.6;">${x.con.replace(/\n/g, '<br>')}</div>
                            </div>`;
            });
            document.getElementById('report-out').innerHTML = htmlOut;
            currentPrompt = `请深度分析我过去 ${days} 天的日记，帮我提炼出核心情绪、成长感悟以及主要发生的事件。请用温柔且鼓励的语气回复：\n\n${rawStr}`;
        }

        document.addEventListener('click', (e) => {
            if(e.target.id === 'btn-copy-prompt') {
                const ta = document.createElement("textarea"); ta.value = currentPrompt;
                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                document.body.removeChild(ta); alert("指令已复制，快去发给 AI 吧！");
            }
            if(e.target.id === 'btn-pdf-export') {
                html2pdf().from(document.getElementById('report-out')).set({ margin: 1, filename: '时光总结.pdf' }).save();
            }
        });

        function save() {
            const date = document.getElementById('f-date').value;
            const con = document.getElementById('f-content').value;
            db = db.filter(x => x.date !== date);
            if(con.trim()) db.push({ date, loc: document.getElementById('f-loc').value, con });
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            switchView('view-main'); renderCal(); renderList();
        }

        function getDateStatus(dateStr) {
            const todayStr = formatLocalDate(new Date());
            const entry = db.find(n => n.date === dateStr);
            const hasContent = entry && entry.con && entry.con.trim();
            let status = "";
            if (dateStr === todayStr) status += " today";
            if (hasContent) status += " has-note";
            
            const target = new Date(dateStr); 
            const now = new Date(); now.setHours(0,0,0,0);
            if (!hasContent && target < now) {
                const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() || 7) - 1));
                if (target < monday && target >= new Date('2026-04-13')) status += " missed";
            }
            return status;
        }

        function renderCal() {
            const body = document.getElementById('cal-body'); body.innerHTML = '';
            const y = curMonth.getFullYear(), m = curMonth.getMonth();
            document.getElementById('cal-display').innerText = `${y}年${m+1}月`;
            
            const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
            for(let i=0; i<first; i++) body.innerHTML += '<div></div>';
            for(let d=1; d<=days; d++) {
                const s = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                body.innerHTML += `<div class="cal-day clickable ${getDateStatus(s)}" onclick="goDate('${s}')">${d}</div>`;
            }
        }

        function switchView(id) { 
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
            window.scrollTo(0,0);
        }
        function openEditor() { goDate(formatLocalDate(new Date())); }
        function goDate(s) { loadDateRecord(s); switchView('view-edit'); }
        function loadDateRecord(s) { 
            const n = db.find(x => x.date === s); 
            document.getElementById('f-date').value = s; 
            document.getElementById('f-loc').value = n ? n.loc : ''; 
            document.getElementById('f-content').value = n ? n.con : ''; 
        }
        
        function updateYearProgress() { 
            const now = new Date(), start = new Date(now.getFullYear(), 0, 1), end = new Date(now.getFullYear()+1, 0, 1); 
            const p = (((now - start) / (end - start)) * 100).toFixed(1); 
            document.getElementById('year-label').innerText = `${now.getFullYear()}年进度`;
            document.getElementById('p-fill').style.width = p + '%'; 
            document.getElementById('p-percent').innerText = p + '%'; 
        }
        
        function renderList() { 
            const k = (document.getElementById('q').value || "").toLowerCase();
            const list = db.filter(x => x.con && x.con.toLowerCase().includes(k)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10); 
            document.getElementById('list-body').innerHTML = list.map(x => 
                `<div class="list-item clickable" onclick="goDate('${x.date}')">
                    <div style="font-weight:600; margin-bottom:6px; display:flex; align-items:center;">
                        ${x.date} <span style="font-weight:normal; font-size:12px; color:var(--text-sub); margin-left:8px;">${x.loc || ''}</span>
                    </div>
                    <div style="font-size:15px; color:var(--text-sub); line-height:1.5;">${(x.con || "").substring(0,40)}...</div>
                </div>`
            ).join(''); 
        }

        function toggleMonthPicker() { 
            window.isMonthPicker = !window.isMonthPicker; 
            document.getElementById('cal-view-grid').style.display = window.isMonthPicker ? 'none' : 'block'; 
            document.getElementById('cal-view-months').style.display = window.isMonthPicker ? 'block' : 'none'; 
            if(window.isMonthPicker) { 
                const grid = document.getElementById('month-grid'); grid.innerHTML = ''; 
                for(let i=0; i<12; i++){ 
                    const it = document.createElement('div'); it.className='action-btn clickable'; it.innerText = `${i+1}月`; 
                    it.style.color = 'var(--text-main)';
                    it.onclick = () => { curMonth.setMonth(i); toggleMonthPicker(); }; 
                    grid.appendChild(it); 
                } 
            } else { renderCal(); }
        }
        
        function exportData() { 
            const b = new Blob([JSON.stringify(db)], {type:"application/json"}); 
            const a = document.createElement("a"); 
            a.href=URL.createObjectURL(b); a.download=`Diary_Backup_${formatLocalDate(new Date())}.json`; a.click(); 
        }
        function importData(e) { 
            const r = new FileReader(); 
            r.onload = (ev) => { 
                db = JSON.parse(ev.target.result); 
                localStorage.setItem(DB_KEY, JSON.stringify(db)); 
                renderCal(); renderList(); alert("数据导入成功！"); 
            }; 
            r.readAsText(e.target.files[0]); 
        }
        
        function handleTouchStart(e) { touchStartX = e.changedTouches[0].screenX; }
        function handleTouchEnd(e) { 
            let diff = e.changedTouches[0].screenX - touchStartX; 
            if(Math.abs(diff) > 100) { 
                document.getElementById('f-content').blur();
                let parts = document.getElementById('f-date').value.split('-');
                let d = new Date(parts[0], parts[1] - 1, parts[2]); 
                d.setDate(d.getDate() + (diff > 0 ? -1 : 1)); 
                
                // 翻页时的微动画反馈
                const editor = document.querySelector('.diary-card');
                editor.style.transform = `translateX(${diff > 0 ? '10px' : '-10px'})`;
                editor.style.opacity = '0.5';
                setTimeout(() => {
                    loadDateRecord(formatLocalDate(d)); 
                    editor.style.transition = 'transform 0.2s, opacity 0.2s';
                    editor.style.transform = 'translateX(0)';
                    editor.style.opacity = '1';
                }, 100);
            } 
        }
    </script>
</body>
</html>
